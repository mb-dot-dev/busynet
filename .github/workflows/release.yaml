name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Dry run from a branch: builds, tests and packages every target, but skips the GitHub release and Homebrew.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Only macOS arm64 for now. To add Linux back, turn this into a matrix over os/rid/target: ubuntu-22.04 and
    # ubuntu-22.04-arm (glibc 2.35), rids linux-x64 / linux-arm64, targets linux-amd64 / linux-arm64; then enable the
    # matching Homebrew targets.
    name: build (osx-arm64)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      RID: osx-arm64
      TARGET: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dryrun" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: dotnet test -c Release

      - name: Publish (native AOT)
        run: dotnet publish src/Busynet.Cli -c Release -r "$RID" -p:PublishAot=true -p:Version="$VERSION" -p:DebugType=none -o ./publish

      - name: Smoke test
        run: |
          test "$(./publish/busynet --version)" = "$VERSION"
          ./publish/busynet claude limits --help
          ./publish/busynet gh workflow --help
          ./publish/busynet bkk departures --help

      - name: Package
        run: tar -C publish -czf "busynet-${VERSION}-${TARGET}.tar.gz" busynet

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: busynet-${{ env.TARGET }}
          path: busynet-*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum busynet-*.tar.gz > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/busynet-*.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  homebrew:
    name: update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Justintime50/homebrew-releaser@454cc0d45a99949c9ea0bd9f03e6309df1617628 # v4.0.0
        with:
          homebrew_owner: mb-dot-dev
          homebrew_tap: homebrew-tap
          github_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          target_darwin_arm64: true
          skip_checksum: true
          install: 'bin.install "busynet"'
          test: 'assert_match version.to_s, shell_output("#{bin}/busynet --version")'
